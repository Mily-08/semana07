</div>

<label class="block font-label-lg text-label-lg text-on-surface-variant mb-1" for="password">Contraseña</label>

<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-utp-red transition-colors" onclick="togglePassword()" type="button">

</div>
<div class="flex justify-end">

<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const passwordIcon = document.getElementById('passwordIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordIcon.innerText = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                passwordIcon.innerText = 'visibility';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerText;
            btn.innerHTML = '<div class="flex items-center justify-center gap-2"><div class="w-4 h-4 border-2 border-pure-white border-t-transparent rounded-full animate-spin"></div> INGRESANDO...</div>';
            btn.disabled = true;
            
            setTimeout(() => {
                btn.innerText = originalText;
                btn.disabled = false;
                alert('Funcionalidad de inicio de sesión no disponible en esta demostración.');
            }, 1500);
        });
    </script>
